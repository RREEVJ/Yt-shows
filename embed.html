<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embed Video</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="gradient-default">
    <main class="embed-page">
        <button id="backButton" class="btn" type="button">Back to Playlist</button>
        <div class="video-wrap">
            <iframe
                id="videoFrame"
                src=""
                title="Embedded video"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('v');
        const listId = params.get('list');
        const videoFrame = document.getElementById('videoFrame');
        const backButton = document.getElementById('backButton');

        if (videoId) {
            const embedUrl = new URL('https://www.youtube.com/embed/' + videoId);
            if (listId) embedUrl.searchParams.set('list', listId);
            embedUrl.searchParams.set('rel', '0');
            videoFrame.src = embedUrl.toString();
        }

        backButton.addEventListener('click', () => {
            if (listId) {
                window.location.href = 'watch.html?list=' + encodeURIComponent(listId);
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
